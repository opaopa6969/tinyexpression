name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  rust-parser:
    name: Rust P4 parser binary, C ABI and wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust 1.85
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.85.0
      - name: Verify vendored ubnfc parser and generated adapter
        run: bash rust/check-generated.sh
      - name: Test and lint Rust parser
        run: |
          cargo fmt --all --manifest-path rust/Cargo.toml --check
          cargo test --locked --manifest-path rust/Cargo.toml
          cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Build and smoke-test release binary
        run: |
          cargo build --release --locked --manifest-path rust/Cargo.toml -p tinyexpression-rs
          rust/target/release/tinyexpression --version | grep -q "^tinyexpression $(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml) (ubnfc $(sed -n 's/^ubnfc_commit=//p' rust/ubnfc-pin.txt))$"
          rust/target/release/tinyexpression --help | grep -q '^Exit codes:'
          printf '%s' '1 + 2' | rust/target/release/tinyexpression parse - | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value["ok"] and value["ast"]["type"] == "FormulaExpr"'
          smoke_file=$(mktemp "$RUNNER_TEMP/tinyexpression.XXXXXX")
          printf '%s\n' "var \$price as number set 3;" "\$price + 4" > "$smoke_file"
          rust/target/release/tinyexpression parse "$smoke_file" | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value["ok"] and value["ast"]["type"] == "FormulaExpr"'
          rust/target/release/tinyexpression run src/test/resources/formulaInfo-ubnf/accept-18-depends-on.fi | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value["ok"] and [f["info"]["calculatorName"] for f in value["formulas"]] == ["base", "derived"]'
      # issue #181: the cdylib + C header, linked from C with gcc.
      - name: C ABI (cdylib) smoke test
        run: bash rust/tinyexpression-ffi/tests/c/run.sh release
      # issue #181: the library and the wasm exports build for wasm32-unknown-unknown, and the
      # browser demo's binding runs under node.
      - name: wasm32 build and node smoke test
        run: |
          cargo build --release --locked --manifest-path rust/Cargo.toml --target wasm32-unknown-unknown -p tinyexpression-rs --lib
          cargo build --profile release-small --locked --manifest-path rust/Cargo.toml --target wasm32-unknown-unknown -p tinyexpression-ffi
          ls -l rust/target/wasm32-unknown-unknown/release-small/tinyexpression.wasm
          node rust/examples/wasm/node-smoke.mjs
      - name: Package Linux x86_64 binary
        run: |
          package_dir=$(mktemp -d "$RUNNER_TEMP/tinyexpression-package.XXXXXX")
          install -m 0755 rust/target/release/tinyexpression "$package_dir/tinyexpression"
          install -m 0644 LICENSE "$package_dir/LICENSE"
          install -m 0644 rust/tinyexpression-rs/README.md "$package_dir/README.md"
          tar -czf rust/target/tinyexpression-linux-x86_64.tar.gz -C "$package_dir" tinyexpression LICENSE README.md
      - uses: actions/upload-artifact@v6
        with:
          name: tinyexpression-linux-x86_64
          path: rust/target/tinyexpression-linux-x86_64.tar.gz
          if-no-files-found: error

  # issue #201: the language catalog, and the playground's evaluation path (tinyexpression.wasm +
  # the JS binding + the CalculationContext mapping) against the Java differential golden.
  playground:
    name: Catalog and playground (wasm parity smoke, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust 1.85 with wasm32
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.85.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - name: Catalog derived files are up to date
        run: node catalog/scripts/generate-derived.mjs --check
      - name: Install playground dependencies
        run: npm ci
        working-directory: playground
      - name: Build tinyexpression.wasm for the playground
        run: npm run build:wasm
        working-directory: playground
      - name: Parity smoke (Java differential golden through the playground evaluation path)
        run: npm run parity
        working-directory: playground
      - name: Playground checks (catalog schema, samples, TE diagnostics)
        run: npm run check
        working-directory: playground
      - name: Build the static site
        run: npm run build
        working-directory: playground
      # issue #201 stage 4: the Catalog panel's editing model exports the repository catalog
      # byte-identically, it validates, the derived .tecatalog / error-catalog.json regenerate
      # byte-identically, and the VSIX golden override is what the panel exports.
      - name: Catalog round trip (playground export -> validate -> derived files)
        run: npm run roundtrip
        working-directory: playground
      # issue #201 stage 5: the VSIX embeds this build (playground-dist/) for the
      # "TinyExpression: Open playground" webview.
      - name: VSIX with the embedded playground (unit tests, vsce package, size)
        working-directory: tools/tinyexpression-p4-lsp-vscode
        env:
          TE_REQUIRE_PLAYGROUND: '1'
        run: |
          npm ci
          npm test
          npx --yes @vscode/vsce package --no-dependencies --out "$RUNNER_TEMP/tinyexpression-p4-lsp-playground.vsix"
          unzip -l "$RUNNER_TEMP/tinyexpression-p4-lsp-playground.vsix" | grep -E 'playground-dist/(index.html|tinyexpression.wasm|assets/)'
          size=$(stat -c %s "$RUNNER_TEMP/tinyexpression-p4-lsp-playground.vsix")
          echo "VSIX with the embedded playground: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: playground-dist
          path: playground/dist
          if-no-files-found: error

  ubnfc-parser:
    name: ubnfc default engine (pin, converter, parity, both engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Create an empty Maven repository on the assigned runner
        run: |
          task_maven_repo=$(mktemp -d "$RUNNER_TEMP/ubnfc-parser.XXXXXX")
          echo "MAVEN_REPO=$task_maven_repo" >> "$GITHUB_ENV"
      # tinyexpression #220: unlaxer 3.1.1 (with its -jdk17 artifacts) is merged but not on Maven
      # Central yet; build the pinned unlaxer-parser commit into the job-local repository until it is.
      - name: Install unlaxer from source if it is not on Maven Central yet
        run: bash scripts/ci/install-unlaxer-if-unpublished.sh
      # Grammar sha256 + every vendored file against UBNFC_PIN. ubnfc is private, so the full
      # grammar -> IR -> Java regeneration runs where it is readable (UBNFC_DIR); see the script.
      - name: Verify vendored ubnfc parser against its pin
        run: bash scripts/regenerate-ubnfc-parser.sh --check
      - name: Verify the generated AST converter
        run: |
          mvn -B -q compile -Dgpg.skip=true -Dtinyexpression.skipRailroad=true -Dmaven.repo.local="$MAVEN_REPO"
          python3 scripts/generate-ubnfc-converter.py --check
      - name: Parity, differential fuzz and engine mode matrix
        run: >-
          mvn -B test -Dgpg.skip=true -Dtinyexpression.skipRailroad=true -Dmaven.repo.local="$MAVEN_REPO"
          -Dtest=UbnfcParityTest,UbnfcDifferentialFuzzTest,P4EngineModeMatrixTest,P4ParserEngineTest,P4DslJavaCodeCalculatorTest,P4DslJavaCodeCalculatorClassicEngineTest,P4AstEvaluatorCalculatorTest,P4AstEvaluatorCalculatorClassicEngineTest,P4PreferredAstMapperDiagnosticsTest,P4SourceMappingTest
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ubnfc-parity
          path: |
            target/ubnfc-parity/
            target/surefire-reports/
          if-no-files-found: warn

  mapper-compatibility:
    name: Mapper compatibility (${{ matrix.generator }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        generator: [published, source]
    steps:
      - uses: actions/checkout@v6
        with:
          path: tinyexpression
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Create an empty Maven repository on the assigned runner
        run: |
          task_maven_repo=$(mktemp -d "$RUNNER_TEMP/mapper-compatibility.XXXXXX")
          echo "MAVEN_REPO=$task_maven_repo" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        if: matrix.generator == 'source'
        with:
          repository: opaopa6969/unlaxer-parser
          # Source-mapped alternate-entry contract; update together with its compatibility oracle.
          ref: 6a4187c73f748282524fac579415bcd092ae9c6e
          path: unlaxer-parser
      - name: Install pinned development generator into its isolated repository
        if: matrix.generator == 'source'
        working-directory: unlaxer-parser
        run: >-
          mvn -B -pl .,unlaxer-common,unlaxer-dsl install -DskipTests -Dgpg.skip=true
          -Dmaven.repo.local="$MAVEN_REPO"
      # tinyexpression #220: the `published` leg checks the generator that is on Maven Central. While
      # pom.xml's unlaxer.version (3.1.1) is not published yet, that is the previous release
      # (UNLAXER_PUBLISHED_FALLBACK); the main artifact's default generator output is the same.
      - name: Choose the unlaxer version under test
        working-directory: tinyexpression
        env:
          UNLAXER_PUBLISHED_FALLBACK: 3.1.0
        run: |
          version=$(sed -n 's:.*<unlaxer.version>\(.*\)</unlaxer.version>.*:\1:p' pom.xml | head -1)
          if [ "${{ matrix.generator }}" = published ] \
            && ! curl -fsI "https://repo1.maven.org/maven2/org/unlaxer/unlaxer-dsl/$version/unlaxer-dsl-$version.pom" > /dev/null; then
            echo "unlaxer $version is not on Maven Central; the published leg uses $UNLAXER_PUBLISHED_FALLBACK" | tee -a "$GITHUB_STEP_SUMMARY"
            version=$UNLAXER_PUBLISHED_FALLBACK
          fi
          echo "UNLAXER_VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify public and snapshot APIs without shared Maven state
        working-directory: tinyexpression
        # As of unlaxer 3.1.0 (#209) the published unlaxer-dsl jar already carries the
        # snapshot / node-alias / optional-qualifier generator shapes that used to be
        # source-pin-only (they landed on master at or before the 3.1.0 cut), so both
        # matrix legs expect true here. The `source` leg's own commit pin still matters
        # for later, still-unreleased generator changes (see the checkout step above).
        run: >-
          mvn -B clean test -Dgpg.skip=true -Dmaven.repo.local="$MAVEN_REPO" -Dunlaxer.version="$UNLAXER_VERSION"
          -Dtinyexpression.expected.mapper.snapshot=true
          -Dtinyexpression.expected.mapper.nodeAlias=true
          -Dtinyexpression.expected.mapper.optionalQualifier=true
          -Dtest=P4SourceMappingTest,P4OwnedSliceSourceTest,P4TypedAstEvaluatorTest,P4JavaCodeEmitterSourceTextTest,DslGeneratedAstJavaEmitterTest,P4PreferredAstMapperPrecedenceTest,P4OptionalExternalQualifierTest,P4RustRootExpressionAcceptanceTest,P4RustNumericEvaluatorOracleTest,P4RustScalarEvaluatorOracleTest
      - name: Verify shared Java/Rust parser fixtures with the pinned source generator
        if: matrix.generator == 'source'
        working-directory: tinyexpression
        run: >-
          mvn -B test -Dgpg.skip=true -Dmaven.repo.local="$MAVEN_REPO" -Dunlaxer.version="$UNLAXER_VERSION"
          -Dtinyexpression.skipRailroad=true -Dtinyexpression.rust.shared=true
          -Dtest=P4RustSharedFixtureAcceptanceTest
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mapper-compatibility-${{ matrix.generator }}
          path: tinyexpression/target/surefire-reports/
          if-no-files-found: warn

  # tinyexpression #220: tinyExpression-jdk17 (tinyexpression-jdk17/pom.xml) recompiles the same
  # sources with release 17 against unlaxer-*-jdk17. Build and run the whole test suite on a Java 17
  # JVM and require class file major 61 in every class of the jar.
  jdk17:
    name: tinyExpression-jdk17 on JDK 17 (full tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # JDK 21 only builds unlaxer from source when it is not on Central (its main modules are release 21).
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Create an empty Maven repository on the assigned runner
        run: |
          task_maven_repo=$(mktemp -d "$RUNNER_TEMP/tinyexpression-jdk17.XXXXXX")
          echo "MAVEN_REPO=$task_maven_repo" >> "$GITHUB_ENV"
      # tinyexpression #220: unlaxer 3.1.1 (with its -jdk17 artifacts) is merged but not on Maven
      # Central yet; build the pinned unlaxer-parser commit into the job-local repository until it is.
      - name: Install unlaxer from source if it is not on Maven Central yet
        run: bash scripts/ci/install-unlaxer-if-unpublished.sh
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build and test tinyExpression-jdk17 on JDK 17
        run: >-
          java -version 2>&1 | head -1 &&
          mvn -B -f tinyexpression-jdk17/pom.xml clean package -Dgpg.skip=true
          -Dmaven.repo.local="$MAVEN_REPO"
      - name: Require class file major 61 (Java 17) in the tinyExpression-jdk17 jar
        run: python3 scripts/ci/check_class_major.py 61 tinyexpression-jdk17/target/tinyExpression-jdk17-*[0-9].jar
      - name: The jar must not depend on the release-21 unlaxer artifacts
        run: |
          mvn -B -q -f tinyexpression-jdk17/pom.xml dependency:list -DincludeGroupIds=org.unlaxer \
            -DoutputFile="$RUNNER_TEMP/unlaxer-deps.txt" -Dmaven.repo.local="$MAVEN_REPO"
          cat "$RUNNER_TEMP/unlaxer-deps.txt"
          if grep -E 'org\.unlaxer:unlaxer-(common|dsl):' "$RUNNER_TEMP/unlaxer-deps.txt"; then
            echo "tinyExpression-jdk17 pulls a release-21 unlaxer artifact" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: jdk17-surefire-reports
          path: tinyexpression-jdk17/target/surefire-reports/
          if-no-files-found: warn

  # issue #173: the Java CI above resolves org.unlaxer:unlaxer-* from Maven Central, so a
  # regression on unlaxer-parser master (development) is invisible until it is published (it
  # took 2 days to notice unlaxer-parser#269 this way). This job tracks unlaxer-parser's master
  # branch directly instead of a pin, so it is deliberately non-blocking (continue-on-error):
  # master can legitimately be ahead of what tinyexpression's Rust side is pinned to
  # (rust/ubnfc-pin.txt), and hosted/self-hosted runner flakiness shouldn't gate merges either.
  # Treat a red run here as an early warning to investigate, not a merge blocker.
  unlaxer-dev:
    name: Java against unlaxer-parser master (development)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tinyexpression-ci]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          path: tinyexpression

      - uses: actions/checkout@v6
        with:
          repository: opaopa6969/unlaxer-parser
          ref: master
          path: unlaxer-parser

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create an empty Maven repository on the self-hosted runner
        run: |
          task_maven_repo=$(mktemp -d "$RUNNER_TEMP/tinyexpression-unlaxer-dev.XXXXXX")
          echo "MAVEN_REPO=$task_maven_repo" >> "$GITHUB_ENV"

      # Read the checked-out master's own <revision> so the job tracks whatever unlaxer-parser
      # bumps it to, rather than a value hardcoded in this workflow.
      - name: Record the unlaxer-parser master revision under test
        id: unlaxer_rev
        working-directory: unlaxer-parser
        run: |
          commit=$(git rev-parse --short HEAD)
          version=$(sed -n 's/.*<revision>\(.*\)<\/revision>.*/\1/p' pom.xml | head -1)
          if [ -z "$version" ]; then
            echo "could not read <revision> from unlaxer-parser/pom.xml" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### unlaxer-parser master (development) under test"
            echo ""
            echo "- commit: \`$commit\`"
            echo "- pom revision (used as -Dunlaxer.version): \`$version\`"
            echo ""
            echo "This job is \`continue-on-error: true\` and does not block merges; unlaxer-parser"
            echo "master can legitimately be ahead of tinyexpression's Rust pin."
          } >> "$GITHUB_STEP_SUMMARY"

      # Do NOT pass -Dflatten.skip=true: the consumer POMs need flatten to resolve ${revision},
      # and skipping it leaves ${revision} unresolved for the isolated repo install (see docs).
      - name: Install unlaxer-parser master into its isolated repository
        working-directory: unlaxer-parser
        run: >-
          mvn -B -pl .,unlaxer-common,unlaxer-dsl install -DskipTests -Dgpg.skip=true
          -Dmaven.repo.local="$MAVEN_REPO"

      - name: Run the tinyexpression Java test suite against unlaxer-parser master
        working-directory: tinyexpression
        run: >-
          mvn -B test -Dgpg.skip=true -Dmaven.repo.local="$MAVEN_REPO"
          -Dunlaxer.version=${{ steps.unlaxer_rev.outputs.version }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unlaxer-dev-surefire-reports
          path: tinyexpression/target/surefire-reports/
          if-no-files-found: warn

  smoke:
    name: P4 smoke (targeted matrix)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tinyexpression-ci]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github-unlaxer
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Create an empty Maven repository on the self-hosted runner
        run: |
          task_maven_repo=$(mktemp -d "$RUNNER_TEMP/tinyexpression-smoke.XXXXXX")
          echo "MAVEN_REPO=$task_maven_repo" >> "$GITHUB_ENV"
      # tinyexpression #220: unlaxer 3.1.1 (with its -jdk17 artifacts) is merged but not on Maven
      # Central yet; build the pinned unlaxer-parser commit into the job-local repository until it is.
      - name: Install unlaxer from source if it is not on Maven Central yet
        run: bash scripts/ci/install-unlaxer-if-unpublished.sh

      - name: Validate Central release guard
        run: |
          python3 scripts/tests/test_central_release_guard.py
          bash -n scripts/release-central.sh

      - name: Smoke — root (P4 typed AST + parity matrix)
        run: mvn -B -P p4-smoke test -Dgpg.skip=true -Dmaven.repo.local="$MAVEN_REPO"

      - name: Install main artifact to local repo (for LSP smoke)
        run: mvn -B install -DskipTests -Dgpg.skip=true -Dmaven.repo.local="$MAVEN_REPO"

      - name: Smoke — LSP module
        run: mvn -B -P p4-smoke test -Dgpg.skip=true -Dmaven.repo.local="$MAVEN_REPO"
        working-directory: tools/tinyexpression-p4-lsp-vscode
        env:
          MAVEN_OPTS: >-
            --add-opens=java.base/java.util=ALL-UNNAMED
            --add-opens=java.base/java.lang=ALL-UNNAMED

  build:
    name: Full verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tinyexpression-ci]
    needs: [smoke, playground]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github-unlaxer
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Create an empty Maven repository on the self-hosted runner
        run: |
          task_maven_repo=$(mktemp -d "$RUNNER_TEMP/tinyexpression-build.XXXXXX")
          echo "MAVEN_REPO=$task_maven_repo" >> "$GITHUB_ENV"
      # tinyexpression #220: unlaxer 3.1.1 (with its -jdk17 artifacts) is merged but not on Maven
      # Central yet; build the pinned unlaxer-parser commit into the job-local repository until it is.
      - name: Install unlaxer from source if it is not on Maven Central yet
        run: bash scripts/ci/install-unlaxer-if-unpublished.sh

      # 既知の失敗 (test-baseline.txt) は許容し、新規失敗のみで fail する。
      # ベースラインの縮小が進捗。詳細は tools/ci/check-test-baseline.sh。
      - name: Build and verify (main, baseline-gated)
        run: >-
          mvn -B verify -Dgpg.skip=true -Dmaven.test.failure.ignore=true
          -Dmaven.repo.local="$MAVEN_REPO"

      - name: Check test failures against baseline
        run: bash tools/ci/check-test-baseline.sh

      - name: Install main artifact to local repo
        run: mvn -B install -DskipTests -Dgpg.skip=true -Dmaven.repo.local="$MAVEN_REPO"

      # tinyexpression #220: the main artifact stays Java 21 (class file major 65).
      - name: Require class file major 65 (Java 21) in the main jar
        run: python3 scripts/ci/check_class_major.py 65 target/tinyExpression-*[0-9].jar

      - name: Set up Node.js (for vsce packaging in tools)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # issue #201 stage 5: the playground build (wasm + bundle) from the playground job, packaged
      # into the VSIX by the extension's vscode:prepublish (scripts/copy-playground.mjs).
      - uses: actions/download-artifact@v7
        with:
          name: playground-dist
          path: playground/dist

      - name: Build and verify tools/tinyexpression-p4-lsp-vscode
        run: mvn -B verify -Dgpg.skip=true -Dmaven.repo.local="$MAVEN_REPO"
        working-directory: tools/tinyexpression-p4-lsp-vscode
        env:
          TE_REQUIRE_PLAYGROUND: '1'
          MAVEN_OPTS: >-
            --add-opens=java.base/java.util=ALL-UNNAMED
            --add-opens=java.base/java.lang=ALL-UNNAMED

      # verify で生成された VSIX を成果物として添付 (タグ push 時の
      # Release 添付は release-vsix.yml を参照)
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: tinyexpression-p4-lsp-vsix
          path: tools/tinyexpression-p4-lsp-vscode/target/*.vsix
          if-no-files-found: error
