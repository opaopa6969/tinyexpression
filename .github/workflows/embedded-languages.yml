name: Embedded language consumer
on:
  pull_request:
  push:
    branches: [master]
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.9'
      - uses: actions/checkout@v6
        with:
          repository: opaopa6969/unlaxer-parser
          ref: a3d1b131f1509361e94924e64c0f2cf65da9fb5a
          path: .integration/unlaxer-parser
      - name: Install source-map and diagnostic APIs
        working-directory: .integration/unlaxer-parser
        run: mvn -B -pl unlaxer-common,unlaxer-dsl -am install -DskipTests -Dgpg.skip=true
      - name: Install production Tiny with current default dependencies
        run: mvn -B install -DskipTests -Dtinyexpression.skipRailroad=true -Dgpg.skip=true
      - name: Default LSP and DAP compatibility
        working-directory: tools/tinyexpression-p4-lsp-vscode
        run: mvn -B clean test -Dtest=TinyExpressionP4LanguageServerExtTest,TinyExpressionP4DebugAdapterExtTest
      - name: Real javac through existing opt-in LSP consumer
        working-directory: tools/tinyexpression-p4-lsp-vscode
        run: |
          mvn -B clean package -Pembedded-languages -Dgpg.skip=true -Dtest=ProductionEmbeddedDiagnosticsTest,TinyExpressionP4LanguageServerExtTest,TinyExpressionP4DebugAdapterExtTest
          python3 scripts/check-embedded-lsp.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Extension setting and TypeScript checks
        working-directory: tools/tinyexpression-p4-lsp-vscode
        run: |
          npm ci --ignore-scripts
          npm run compile
          npm test
