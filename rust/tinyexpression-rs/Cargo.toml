[package]
name = "tinyexpression-rs"
# Shares the Java release's version number (rust/README.md, "Versioning").
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "TinyExpression without a JVM: the P4 grammar parser (generated by ubnfc), the Java-compatible evaluator, the FormulaInfo loader and the `tinyexpression` CLI"
readme = "README.md"
keywords = ["expression", "parser", "evaluator", "dsl", "formula"]
categories = ["parser-implementations", "command-line-utilities"]
# The Java differential corpus and golden (3 MB), the Java parity drivers and the criterion
# bench (it reads benchmarks/fixtures at the repository root) need the rest of the
# repository; they stay in git and out of the published crate.
exclude = ["benches/", "tests/java-diff/", "tests/formula-info/", "tests/java_differential.rs", "tests/formula_info.rs"]

[dependencies]
criterion = { version = "0.5", optional = true }

[features]
benchmarks = ["dep:criterion"]

[lib]
name = "tinyexpression_rs"
path = "src/lib.rs"

[[bin]]
name = "tinyexpression"
path = "src/main.rs"

[[bench]]
name = "parser"
harness = false
required-features = ["benchmarks"]

# The vendored ubnfc AST carries an optional `json` feature (serde) that this crate does not
# enable; declare the cfg value so the dependency-free build stays warning-free.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("json"))'] }
